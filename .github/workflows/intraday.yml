name: Intraday Scan (TW market hours)

on:
  schedule:
    # 以台灣時間為準。GitHub 免費版排程常遲到 30-60 分且 :00/:30 最擁擠，
    # 故改用冷門分鐘，且收盤前掃描提早預約，遲到後剛好落在 13:00-13:25
    # 台灣 09:12-12:42 = UTC 01:12-04:42
    - cron: '12,42 1-4 * * 1-5'
    # 預約台灣 12:35 = UTC 04:35（實際多半 13:05-13:25 開跑，收盤 13:30 前）
    - cron: '35 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday scan
        env:
          LINE_TOKEN:    ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID:  ${{ secrets.LINE_USER_ID }}
        run: python intraday_scan.py

      - name: Commit report
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          for f in ath_industry_report.json scan_output.txt; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --staged --quiet || git commit -m "chore: intraday scan $(date -u +%Y-%m-%d_%H:%M)"
          git push
