name: US holdings valuation + lines

on:
  workflow_dispatch:
  push:
    branches: [main]   # 只在 main 觸發；避免 Actions 把 commit 推到 transcripts-local 造成本機 push 被拒
    paths:
      - 'data/us_lines_request.json'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python us_valuation_lines.py 2>&1 | tee us_holdings_lines_log.txt
      - run: python us_rerating.py 2>&1 | tee us_rerating_log.txt
      - run: python benchmark_0050.py 2>&1 | tee weekly_benchmark_log.txt || true
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          rm -f data/us_lines_request.json
          git add -A -- us_holdings_lines.json us_holdings_lines.md tw_holdings_lines.json weekly_benchmark.json weekly_benchmark.md weekly_benchmark_log.txt us_holdings_lines_log.txt us_rerating.json tw_rerating.json us_rerating_log.txt data/us_lines_request.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "us: 持股估值與出場線快照"
          git pull --rebase --autostash -X theirs || { git rebase --abort 2>/dev/null; git stash drop 2>/dev/null; echo "[WARN] rebase 衝突，改以本次產出覆蓋"; git fetch origin main && git reset --soft origin/main && git commit -qm "chore: update state $(date -u +%Y-%m-%d) (post-conflict)" || true; }
          git push
