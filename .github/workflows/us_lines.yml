name: US holdings valuation + lines

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/us_lines_request.json'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python us_valuation_lines.py 2>&1 | tee us_holdings_lines_log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          rm -f data/us_lines_request.json
          git add -A -- us_holdings_lines.json us_holdings_lines.md us_holdings_lines_log.txt data/us_lines_request.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "us: 持股估值與出場線快照"
          git pull --rebase --autostash || true
          git push
